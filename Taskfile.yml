version: "3"

# Post-pivot Taskfile.
#
# spec-filesystem-substrate.md replaced the React SPA + Vite + bruno
# stack with a server-rendered HTML shell living inside the Go binary.
# Everything that used to need npm is gone; what remains is `go` and
# the dogfood self-test.

vars:
  BINARY: agentboard
  PORT: "3000"

includes:
  landing:
    taskfile: ./landing/Taskfile.yml
    dir: ./landing

tasks:
  default:
    desc: List available tasks
    cmds:
      - task -l
    silent: true

  build:
    desc: Build the Go binary (embeds internal/html/assets)
    cmds:
      - go build -ldflags="-s -w" -o {{.BINARY}} ./cmd/agentboard
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY}}"

  dev:
    desc: Run the server in dev mode (auto-reloads templates from disk)
    cmds:
      - go run ./cmd/agentboard --dev --no-open --port {{.PORT}}

  run:
    desc: Run the built binary (pass flags with -- e.g. task run -- --port 3001)
    deps: [build]
    cmds:
      - ./{{.BINARY}} {{.CLI_ARGS}}

  test:
    desc: Run Go tests
    cmds:
      - go test ./cmd/... ./internal/...

  test:dogfood:
    desc: |
      §15 bootstrap self-test. Boots an ephemeral AgentBoard, points a
      fresh Claude session at it with the one-sentence prompt, and
      verifies the agent can READ → SKILL → useful work from a cold
      start. Results land in test/dogfood/results/<timestamp>/. Costs
      real Claude budget.
    deps: [build]
    cmds:
      - ./test/dogfood/run.sh

  lint:
    desc: Run gofmt check + go vet
    cmds:
      - |
        unformatted=$(gofmt -l cmd internal)
        if [ -n "$unformatted" ]; then
          echo "gofmt violations:"
          echo "$unformatted"
          exit 1
        fi
      - go vet ./cmd/... ./internal/...

  fmt:
    desc: Apply gofmt to all Go files
    cmds:
      - gofmt -w cmd internal

  deploy:vps:
    desc: Install or update AgentBoard on a Debian/Ubuntu VPS over SSH
    cmds:
      - ./scripts/deploy-vps.sh {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    deps: [landing:clean]
    cmds:
      - rm -f {{.BINARY}}
